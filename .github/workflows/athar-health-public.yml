name: Build ATHAR public preview videos

on:
  push:
    branches: [main]
    paths:
      - "athar-health/.generate-videos"
      - "athar-health/scripts/generate_videos.py"
      - ".github/workflows/athar-health-public.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install generator dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir pillow numpy

      - name: Generate visible vertical MP4 videos
        shell: bash
        run: |
          set -euo pipefail
          python3 athar-health/scripts/generate_videos.py
          for file in athar-health/assets/demo_*.mp4; do
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,profile,pix_fmt,width,height,has_b_frames,level,duration \
              -of default=noprint_wrappers=1 "$file"
          done

      - name: Commit generated videos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ATHAR Public Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add athar-health/assets/demo_*.mp4
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            exit 0
          fi
          git commit -m "Generate ATHAR public preview videos"
          git push origin HEAD:main
