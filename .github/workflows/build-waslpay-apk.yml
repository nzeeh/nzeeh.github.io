name: Build WaslPay Android APK

on:
  push:
    branches:
      - waslpay-android-demo
    paths:
      - '.build/**'
      - '.github/workflows/build-waslpay-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          cat .build/waslpay-src.b64.part-* | base64 --decode > /tmp/waslpay-src.tar.gz
          echo "2f79c2965bc1cef08f7691ea8e28f9cbc93eacca8a0303aafd2e89b6f05e9b9d  /tmp/waslpay-src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/waslpay-src.tar.gz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android/waslpay
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp android/waslpay/app/build/outputs/apk/debug/app-debug.apk WaslPay-Demo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaslPay-Demo-APK
          path: WaslPay-Demo.apk
          if-no-files-found: error
          retention-days: 30
