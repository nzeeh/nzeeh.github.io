name: Build Maqtaf Release APK v0.2.3

on:
  workflow_dispatch:
  push:
    branches:
      - maqtaf-apk-build
    paths:
      - "maqtaf_release_app/**"
      - ".github/workflows/build-maqtaf-release-apk-v023.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve source and set release identity
        run: |
          cp maqtaf_release_app/lib/main.dart /tmp/maqtaf-main.dart
          cp maqtaf_release_app/pubspec.yaml /tmp/maqtaf-pubspec.yaml
          cp maqtaf_release_app/test/widget_test.dart /tmp/maqtaf-test.dart
          sed -i 's/مَقْطَف/مقطف/g' /tmp/maqtaf-main.dart /tmp/maqtaf-test.dart
          sed -i 's/^version:.*/version: 0.2.3+5/' /tmp/maqtaf-pubspec.yaml

      - name: Generate Android platform
        working-directory: maqtaf_release_app
        run: flutter create --platforms=android --org com.maqtaf.market --project-name maqtaf_release .

      - name: Restore authored source
        run: |
          cp /tmp/maqtaf-main.dart maqtaf_release_app/lib/main.dart
          cp /tmp/maqtaf-pubspec.yaml maqtaf_release_app/pubspec.yaml
          cp /tmp/maqtaf-test.dart maqtaf_release_app/test/widget_test.dart
          sed -i 's/مَقْطَف/مقطف/g' maqtaf_release_app/tool/prepare_android.py

      - name: Apply Yemeni identity and Android permissions
        run: python3 maqtaf_release_app/tool/prepare_android.py

      - name: Resolve, analyze, and test
        working-directory: maqtaf_release_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build release APK
        working-directory: maqtaf_release_app
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.invalid/api/v1

      - name: Prepare artifact
        run: |
          cp maqtaf_release_app/build/app/outputs/flutter-apk/app-release.apk Maqtaf-Yemen-v0.2.3.apk
          sha256sum Maqtaf-Yemen-v0.2.3.apk > Maqtaf-Yemen-v0.2.3.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Maqtaf-Yemen-Release-APK-v023
          path: |
            Maqtaf-Yemen-v0.2.3.apk
            Maqtaf-Yemen-v0.2.3.apk.sha256
          retention-days: 30
          if-no-files-found: error
