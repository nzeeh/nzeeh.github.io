name: Build Maqtaf Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - maqtaf-apk-build
    paths:
      - "maqtaf_app/**"
      - ".github/workflows/build-maqtaf-apk.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve application source
        run: |
          cp maqtaf_app/lib/main.dart /tmp/maqtaf-main.dart
          cp maqtaf_app/pubspec.yaml /tmp/maqtaf-pubspec.yaml
          cp maqtaf_app/test/widget_test.dart /tmp/maqtaf-widget-test.dart

      - name: Generate Android platform
        working-directory: maqtaf_app
        run: flutter create --platforms=android --org com.maqtaf.market --project-name maqtaf .

      - name: Restore application source
        run: |
          cp /tmp/maqtaf-main.dart maqtaf_app/lib/main.dart
          cp /tmp/maqtaf-pubspec.yaml maqtaf_app/pubspec.yaml
          cp /tmp/maqtaf-widget-test.dart maqtaf_app/test/widget_test.dart

      - name: Apply Yemeni branding and permissions
        run: python3 maqtaf_app/tool/prepare_android.py

      - name: Install packages
        working-directory: maqtaf_app
        run: flutter pub get

      - name: Analyze
        working-directory: maqtaf_app
        run: flutter analyze

      - name: Test
        working-directory: maqtaf_app
        run: flutter test

      - name: Build release APK
        working-directory: maqtaf_app
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.invalid/api/v1

      - name: Rename APK
        run: cp maqtaf_app/build/app/outputs/flutter-apk/app-release.apk Maqtaf-Yemen-v0.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Maqtaf-Yemen-Android-APK
          path: Maqtaf-Yemen-v0.2.0.apk
          if-no-files-found: error
          retention-days: 30
