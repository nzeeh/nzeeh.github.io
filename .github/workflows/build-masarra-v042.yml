name: Masarra 0.4.2 Date Flexibility

on:
  push:
    branches: [masarra-pro-v0.4.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified 0.3 baseline
        run: python3 .masarra-v03/restore.py
      - name: Apply verified 0.4.2 source delta
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .masarra-v042/patch.xz.b64 > /tmp/v042.patch.xz
          echo '2ab508b7d1f15a4740574d21dac6a156a6ac43e44a05e2c0eb5168594b66b657  /tmp/v042.patch.xz' | sha256sum -c -
          xz -dc /tmp/v042.patch.xz > /tmp/v042.patch
          patch -p2 -d Masarra-Pro-v0.3.0 --batch --forward < /tmp/v042.patch
          mv Masarra-Pro-v0.3.0 Masarra-Pro-v0.4.2
          python3 - <<'PY'
          from pathlib import Path
          root=Path('Masarra-Pro-v0.4.2')
          p=root/'README_AR.md'; s=p.read_text(); s=s.replace('آخر تعديل: الثلاثاء 16 سبتمبر 2026','آخر تعديل: الأربعاء 16 سبتمبر 2026'); p.write_text(s)
          p=root/'INSTALL_AR.txt'; s=p.read_text(); s=s.replace('مسرّة اليمن 0.4.0 — الثلاثاء 16 سبتمبر 2026','مسرّة اليمن 0.4.2 — الأربعاء 16 سبتمبر 2026'); p.write_text(s)
          PY
          grep -q '"version": "0.4.2"' Masarra-Pro-v0.4.2/package.json
          grep -q 'الأربعاء 16 سبتمبر 2026' Masarra-Pro-v0.4.2/CHANGELOG_AR.md
      - name: Install pinned dependencies and run domain tests
        working-directory: Masarra-Pro-v0.4.2
        run: |
          npm install --no-audit --no-fund
          npm test | tee v042-node-tests.txt
          python3 scripts/standalone.py
      - name: Sync Android and enforce native identity
        working-directory: Masarra-Pro-v0.4.2
        run: |
          npx cap sync android
          node scripts/configure-native.mjs
          grep -q 'versionCode 6' android/app/build.gradle
          grep -q 'versionName "0.4.2"' android/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build preview APK and unsigned AAB
        working-directory: Masarra-Pro-v0.4.2/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease
      - name: Verify and prepare Android delivery
        working-directory: Masarra-Pro-v0.4.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../delivery-android
          cp android/app/build/outputs/apk/debug/app-debug.apk ../delivery-android/Masarra-Pro-v0.4.2-preview.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ../delivery-android/Masarra-Pro-v0.4.2-unsigned.aab
          cp Masarra-Pro-Preview.html README_AR.md CHANGELOG_AR.md INSTALL_AR.txt v042-node-tests.txt ../delivery-android/
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs ../delivery-android/Masarra-Pro-v0.4.2-preview.apk > ../delivery-android/APK-VERIFICATION.txt
          "$AAPT" dump badging ../delivery-android/Masarra-Pro-v0.4.2-preview.apk > ../delivery-android/APK-METADATA.txt
          grep -q "package: name='com.masarra.yemen.preview' versionCode='6' versionName='0.4.2'" ../delivery-android/APK-METADATA.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          src=root/'www'; android=root/'android/app/src/main/assets/public'
          rows=[]
          for p in sorted(x for x in src.rglob('*') if x.is_file()):
              rel=p.relative_to(src); q=android/rel
              assert q.is_file(), rel
              a=hashlib.sha256(p.read_bytes()).hexdigest(); b=hashlib.sha256(q.read_bytes()).hexdigest()
              assert a==b, rel
              rows.append({'file':str(rel),'sha256':a})
          Path('../delivery-android/NATIVE-WWW-SHA256.json').write_text(json.dumps({'count':len(rows),'files':rows},ensure_ascii=False,indent=2))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          out=Path('../delivery-android/Masarra-Pro-v0.4.2-Source-Android-iOS.zip')
          excluded={'node_modules','.gradle','build','build-ios','data','.git','__pycache__'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  rel=p.relative_to(root)
                  if any(x in rel.parts for x in excluded): continue
                  z.write(p,Path(root.name)/rel)
          PY
          (cd ../delivery-android && sha256sum *.apk *.aab *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Masarra-v042-Android-Delivery
          path: delivery-android/
          if-no-files-found: error
          retention-days: 30

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified 0.3 baseline
        run: python3 .masarra-v03/restore.py
      - name: Apply verified 0.4.2 source delta
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .masarra-v042/patch.xz.b64 > /tmp/v042.patch.xz
          echo '2ab508b7d1f15a4740574d21dac6a156a6ac43e44a05e2c0eb5168594b66b657  /tmp/v042.patch.xz' | shasum -a 256 -c -
          xz -dc /tmp/v042.patch.xz > /tmp/v042.patch
          patch -p2 -d Masarra-Pro-v0.3.0 --batch --forward < /tmp/v042.patch
          mv Masarra-Pro-v0.3.0 Masarra-Pro-v0.4.2
          python3 - <<'PY'
          from pathlib import Path
          root=Path('Masarra-Pro-v0.4.2')
          p=root/'README_AR.md'; s=p.read_text(); s=s.replace('آخر تعديل: الثلاثاء 16 سبتمبر 2026','آخر تعديل: الأربعاء 16 سبتمبر 2026'); p.write_text(s)
          p=root/'INSTALL_AR.txt'; s=p.read_text(); s=s.replace('مسرّة اليمن 0.4.0 — الثلاثاء 16 سبتمبر 2026','مسرّة اليمن 0.4.2 — الأربعاء 16 سبتمبر 2026'); p.write_text(s)
          PY
      - name: Install dependencies, test, and sync iOS
        working-directory: Masarra-Pro-v0.4.2
        run: |
          npm install --no-audit --no-fund
          npm test | tee v042-node-tests.txt
          python3 scripts/standalone.py
          npx cap sync ios
          node scripts/configure-native.mjs
          python3 scripts/ios-icon.py
          grep -q 'MARKETING_VERSION = 0.4.2;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 6;' ios/App/App.xcodeproj/project.pbxproj
      - name: Verify Xcode and compile simulator without signing
        working-directory: Masarra-Pro-v0.4.2
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version | tee XCODE-VERSION.txt
          xcrun --sdk iphonesimulator --show-sdk-version | tee IOS-SIMULATOR-SDK.txt
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build | tee ios-build.log
      - name: Prepare iOS evidence
        if: always()
        working-directory: Masarra-Pro-v0.4.2
        run: |
          mkdir -p ../delivery-ios
          cp README_AR.md CHANGELOG_AR.md INSTALL_AR.txt v042-node-tests.txt ../delivery-ios/ 2>/dev/null || true
          cp XCODE-VERSION.txt IOS-SIMULATOR-SDK.txt ../delivery-ios/ 2>/dev/null || true
          if [ -f ios-build.log ]; then tail -150 ios-build.log > ../delivery-ios/IOS-BUILD-RESULT.txt; fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          src=root/'www'; ios=root/'ios/App/App/public'
          if ios.exists():
              rows=[]
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  rel=p.relative_to(src); q=ios/rel
                  assert q.is_file(), rel
                  a=hashlib.sha256(p.read_bytes()).hexdigest(); b=hashlib.sha256(q.read_bytes()).hexdigest()
                  assert a==b, rel
                  rows.append({'file':str(rel),'sha256':a})
              Path('../delivery-ios/NATIVE-WWW-SHA256.json').write_text(json.dumps({'count':len(rows),'files':rows},ensure_ascii=False,indent=2))
          PY
          echo 'This build validates the iOS simulator project only. No signed IPA is produced.' > ../delivery-ios/NO-SIGNED-IPA.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Masarra-v042-iOS-Delivery
          path: delivery-ios/
          if-no-files-found: error
          retention-days: 30
