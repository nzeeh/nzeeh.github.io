name: Diagnose Masarra 0.4.2 Patch
on:
  push:
    branches: [masarra-pro-v0.4.2]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash patch chunks
        run: |
          wc -c .masarra-v042/parts/part*.b64
          sha256sum .masarra-v042/parts/part*.b64
          cat .masarra-v042/parts/part*.b64 > /tmp/all.b64
          sha256sum /tmp/all.b64
          base64 -d /tmp/all.b64 > /tmp/all.xz
          sha256sum /tmp/all.xz
          xz -t /tmp/all.xz
