name: Build Qitaf Android APK
on:
  push:
    branches: [qitaf-apk-build]
    paths-ignore: ['qitaf-build/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qitaf-v04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Restore source and apply v0.4
        run: |
          set -euo pipefail
          cat qitaf_source.b64.part-* | base64 --decode > /tmp/base.zip
          cat qitaf_v02_overlay.b64.part-* | base64 --decode > /tmp/v02.zip
          cat qitaf_v02_hotfix.b64.part-* | base64 --decode > /tmp/hotfix.zip
          cat qitaf_v03_upgrade.b64.part-* | base64 --decode > /tmp/v03.zip
          echo '86dfb39f775c7ff229583127fe6f662240633d6c72d89a08df3eb84ee9277b32  /tmp/v03.zip' | sha256sum -c -
          rm -rf build_workspace qitaf-v04-output
          mkdir -p build_workspace qitaf-v04-output
          for archive in /tmp/base.zip /tmp/v02.zip /tmp/hotfix.zip /tmp/v03.zip; do
            unzip -t "$archive"
            unzip -o -q "$archive" -d build_workspace
          done
          cd build_workspace
          python3 patch_base.py
          python3 integrate_v03.py
          python3 ../finish_v03.py
          python3 ../finish_v04.py
          python3 -m pip install --quiet pillow
          python3 generate_assets.py
      - name: Generate Android and browser projects
        working-directory: build_workspace/qitaf_app
        run: |
          flutter create --platforms=android,web --org com.qitaf --project-name qitaf /tmp/qitaf_scaffold
          cp -R /tmp/qitaf_scaffold/android ./android
          cp -R /tmp/qitaf_scaffold/web ./web
          python3 tool/configure_android.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('applicationId = "com.qitaf.qitaf"', 'applicationId = "com.qitaf.qitaf.demo3"')
          if 'com.qitaf.qitaf.demo3' not in s:
              raise SystemExit('Failed to preserve Qitaf demo applicationId')
          p.write_text(s)
          for filename in ['android/app/src/main/res/values/strings.xml','android/app/src/main/res/values-ar/strings.xml']:
              p=Path(filename)
              p.write_text(p.read_text().replace('>Qitaf<','>Qitaf 0.4<').replace('>قِطاف<','>قِطاف 0.4<'))
          PY
      - name: Resolve and format
        working-directory: build_workspace/qitaf_app
        run: |
          flutter pub get
          dart format lib test
      - name: Analyze
        working-directory: build_workspace/qitaf_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit and interface tests
        working-directory: build_workspace/qitaf_app
        run: flutter test --reporter expanded
      - name: Build Android APK
        working-directory: build_workspace/qitaf_app
        run: flutter build apk --release
      - name: Verify APK, signature and package identity
        run: |
          set -euo pipefail
          cp build_workspace/qitaf_app/build/app/outputs/flutter-apk/app-release.apk qitaf-v04-output/qitaf-demo-v0.4.apk
          unzip -t qitaf-v04-output/qitaf-demo-v0.4.apk | tail -2
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs qitaf-v04-output/qitaf-demo-v0.4.apk | tee qitaf-v04-output/APK_SIGNATURE.txt
          cert_digest=$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' qitaf-v04-output/APK_SIGNATURE.txt)
          old_digest='18eff0942598838296a174f82691cf2b9f01ac91cebf1fdcc4bbb99953487e55'
          {
            echo "v0.3 recorded certificate SHA-256: $old_digest"
            echo "v0.4 certificate SHA-256: $cert_digest"
            if [ "$cert_digest" = "$old_digest" ]; then
              echo 'Signature match: YES. Android can treat this as an upgrade when version/package constraints also allow it.'
            else
              echo 'Signature match: NO. Do not claim in-place upgrade compatibility; keep v0.3 installed if its local demo data matters.'
            fi
          } | tee qitaf-v04-output/UPGRADE_COMPATIBILITY.txt
          (cd qitaf-v04-output && sha256sum qitaf-demo-v0.4.apk > qitaf-demo-v0.4.sha256)
          {
            echo 'Qitaf local demo 0.4.0+4'
            echo 'New: quick budget shortcuts and clearer inclusive shopping paths.'
            echo 'Application ID: com.qitaf.qitaf.demo3 (unchanged from v0.3)'
            echo 'No production wallet, authentication server, delivery service or inter-user livestream service is connected.'
            echo "Source commit: $GITHUB_SHA"
            date -u
            flutter --version
          } > qitaf-v04-output/BUILD_INFO.txt
          cd build_workspace
          zip -qr ../qitaf-v04-output/qitaf-flutter-source-v0.4.zip qitaf_app -x '*/build/*' '*/.dart_tool/*' '*/.gradle/*' '*/local.properties' '*/__pycache__/*'
      - name: Build browser preview archive
        working-directory: build_workspace/qitaf_app
        run: |
          flutter build web --release --no-web-resources-cdn
          cd build/web
          zip -qr ../../../../qitaf-v04-output/qitaf-web-v0.4.zip .
      - name: Prepare changelog and full package
        run: |
          cat > qitaf-v04-output/CHANGELOG_V0.4_AR.txt <<'EOF'
          قِطاف v0.4.0+4 — الثلاثاء 15 سبتمبر 2026 (توقيت الصين)
          - إضافة اختيارات سريعة للميزانية: 3,000 و5,000 و10,000 و20,000 ريال يمني داخل «سلة البيت» مع بقاء الإدخال اليدوي.
          - تحسين لغة المسارين إلى «للبيت والعائلة» و«مختارات وهدايا» عندما تكون تسميات v0.3 الأصلية موجودة.
          - لا تغيّر اختيارات الميزانية أسعار المنتجات؛ هي فقط تضبط المبلغ الذي اختاره المشتري لنفسه.
          - الحفاظ على معرّف حزمة Android: com.qitaf.qitaf.demo3.
          - بيانات الأسعار والمزارع والمخزون والمشاهدات والدفع والتوصيل في النسخة التجريبية ليست بيانات إنتاج حقيقية.
          - البث الحقيقي بين المستخدمين والمدفوعات الحقيقية غير مفعّلين.
          EOF
          cd qitaf-v04-output
          zip -q -9 qitaf-demo-v0.4-package.zip qitaf-demo-v0.4.apk qitaf-demo-v0.4.sha256 APK_SIGNATURE.txt UPGRADE_COMPATIBILITY.txt BUILD_INFO.txt CHANGELOG_V0.4_AR.txt qitaf-flutter-source-v0.4.zip qitaf-web-v0.4.zip
          sha256sum qitaf-demo-v0.4-package.zip > qitaf-demo-v0.4-package.sha256
      - name: Upload tested v0.4 files
        uses: actions/upload-artifact@v4
        with:
          name: qitaf-demo-v0.4
          path: qitaf-v04-output/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested v0.4 files on build branch
        run: |
          set -euo pipefail
          mkdir -p qitaf-build
          cp qitaf-v04-output/qitaf-demo-v0.4.apk qitaf-build/
          cp qitaf-v04-output/qitaf-demo-v0.4.sha256 qitaf-build/
          cp qitaf-v04-output/qitaf-demo-v0.4-package.zip qitaf-build/
          cp qitaf-v04-output/qitaf-demo-v0.4-package.sha256 qitaf-build/
          cp qitaf-v04-output/qitaf-flutter-source-v0.4.zip qitaf-build/
          cp qitaf-v04-output/BUILD_INFO.txt qitaf-build/BUILD_INFO_V0.4.txt
          cp qitaf-v04-output/CHANGELOG_V0.4_AR.txt qitaf-build/
          cp qitaf-v04-output/UPGRADE_COMPATIBILITY.txt qitaf-build/
          git config user.name 'Qitaf Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qitaf-build/qitaf-demo-v0.4.apk qitaf-build/qitaf-demo-v0.4.sha256 qitaf-build/qitaf-demo-v0.4-package.zip qitaf-build/qitaf-demo-v0.4-package.sha256 qitaf-build/qitaf-flutter-source-v0.4.zip qitaf-build/BUILD_INFO_V0.4.txt qitaf-build/CHANGELOG_V0.4_AR.txt qitaf-build/UPGRADE_COMPATIBILITY.txt
          if git diff --cached --quiet; then
            echo 'No v0.4 publish changes.'
          else
            git commit -m '[skip ci] Publish tested Qitaf demo v0.4'
            git push origin HEAD:qitaf-apk-build
          fi
