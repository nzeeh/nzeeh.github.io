name: Build Qitaf Android APK
on:
  push:
    branches: [qitaf-apk-build]
    paths-ignore: ['qitaf-build/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qitaf-v12-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Restore source and apply v0.12
        run: |
          set -euo pipefail
          cat qitaf_source.b64.part-* | base64 --decode > /tmp/base.zip
          cat qitaf_v02_overlay.b64.part-* | base64 --decode > /tmp/v02.zip
          cat qitaf_v02_hotfix.b64.part-* | base64 --decode > /tmp/hotfix.zip
          cat qitaf_v03_upgrade.b64.part-* | base64 --decode > /tmp/v03.zip
          echo '86dfb39f775c7ff229583127fe6f662240633d6c72d89a08df3eb84ee9277b32  /tmp/v03.zip' | sha256sum -c -
          rm -rf build_workspace qitaf-v12-output
          mkdir -p build_workspace qitaf-v12-output
          for archive in /tmp/base.zip /tmp/v02.zip /tmp/hotfix.zip /tmp/v03.zip; do
            unzip -t "$archive"
            unzip -o -q "$archive" -d build_workspace
          done
          cd build_workspace
          python3 patch_base.py
          python3 integrate_v03.py
          for script in ../finish_v03.py ../finish_v04.py ../finish_v05.py ../finish_v06.py ../finish_v07.py ../finish_v08.py ../finish_v09.py ../finish_v10.py ../finish_v11.py ../finish_v12.py; do
            python3 "$script"
          done
          python3 -m pip install --quiet pillow
          python3 generate_assets.py
      - name: Generate Android and web projects
        working-directory: build_workspace/qitaf_app
        run: |
          flutter create --platforms=android,web --org com.qitaf --project-name qitaf /tmp/qitaf_scaffold
          cp -R /tmp/qitaf_scaffold/android ./android
          cp -R /tmp/qitaf_scaffold/web ./web
          python3 tool/configure_android.py
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('applicationId = "com.qitaf.qitaf"', 'applicationId = "com.qitaf.qitaf.demo3"')
          if 'com.qitaf.qitaf.demo3' not in s:
              raise SystemExit('Failed to preserve Qitaf demo applicationId')
          p.write_text(s)
          for filename in ['android/app/src/main/res/values/strings.xml','android/app/src/main/res/values-ar/strings.xml']:
              p=Path(filename)
              p.write_text(p.read_text().replace('>Qitaf<','>Qitaf 0.12<').replace('>قِطاف<','>قِطاف 0.12<'))
          PY2
      - name: Resolve, safe fixes and format
        working-directory: build_workspace/qitaf_app
        run: |
          set -o pipefail
          flutter pub get
          dart fix --apply 2>&1 | tee ../../qitaf-v12-output/DART_FIX.txt
          dart format lib test
      - name: Analyze with zero-issue gate
        working-directory: build_workspace/qitaf_app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../../qitaf-v12-output/ANALYZE.txt
          grep -q 'No issues found' ../../qitaf-v12-output/ANALYZE.txt
      - name: Unit and interface tests
        working-directory: build_workspace/qitaf_app
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ../../qitaf-v12-output/TEST_RESULTS.txt
      - name: Build Android APK
        working-directory: build_workspace/qitaf_app
        run: flutter build apk --release
      - name: Verify APK, signature and package identity
        run: |
          set -euo pipefail
          cp build_workspace/qitaf_app/build/app/outputs/flutter-apk/app-release.apk qitaf-v12-output/qitaf-demo-v0.12.apk
          unzip -t qitaf-v12-output/qitaf-demo-v0.12.apk | tail -2
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs qitaf-v12-output/qitaf-demo-v0.12.apk | tee qitaf-v12-output/APK_SIGNATURE.txt
          cert_digest=$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' qitaf-v12-output/APK_SIGNATURE.txt)
          previous_digest='0c41de0eedb358c14bec01376a6036ea09b0824f2ce83663485bf2d42b9a509b'
          {
            echo "v0.11 recorded certificate SHA-256: $previous_digest"
            echo "v0.12 certificate SHA-256: $cert_digest"
            if [ "$cert_digest" = "$previous_digest" ]; then
              echo 'Signature match: YES. Android can treat this as an upgrade when version/package constraints also allow it.'
            else
              echo 'Signature match: NO. Do not claim in-place upgrade compatibility; keep the prior demo installed if its local data matters.'
            fi
          } | tee qitaf-v12-output/UPGRADE_COMPATIBILITY.txt
          (cd qitaf-v12-output && sha256sum qitaf-demo-v0.12.apk > qitaf-demo-v0.12.sha256)
          {
            echo 'Qitaf local demo 0.12.0+12'
            echo 'New: truthful recipient/address UX removes realistic prefilled personal data, replaces fake speech recognition with optional Arabic read-aloud guidance, and labels map location as preview-only.'
            echo 'Application ID: com.qitaf.qitaf.demo3 (unchanged)'
            echo 'No production wallet, live inventory, analytics, authentication server, delivery service, geocoding/location service or inter-user livestream service is connected.'
            echo "Source commit: $GITHUB_SHA"
            date -u
            flutter --version
          } > qitaf-v12-output/BUILD_INFO.txt
          cd build_workspace
          zip -qr ../qitaf-v12-output/qitaf-flutter-source-v0.12.zip qitaf_app -x '*/build/*' '*/.dart_tool/*' '*/.gradle/*' '*/local.properties' '*/__pycache__/*'
      - name: Build browser preview archive
        working-directory: build_workspace/qitaf_app
        run: |
          flutter build web --release --no-web-resources-cdn
          cd build/web
          zip -qr ../../../../qitaf-v12-output/qitaf-web-v0.12.zip .
      - name: Prepare full package
        run: |
          cp CHANGELOG_V0.12_AR.txt qitaf-v12-output/
          cp USAGE_V0.12_AR.txt qitaf-v12-output/
          cd qitaf-v12-output
          zip -q -9 qitaf-demo-v0.12-package.zip qitaf-demo-v0.12.apk qitaf-demo-v0.12.sha256 APK_SIGNATURE.txt UPGRADE_COMPATIBILITY.txt BUILD_INFO.txt CHANGELOG_V0.12_AR.txt USAGE_V0.12_AR.txt SOURCE_CLEANUP.txt DART_FIX.txt ANALYZE.txt TEST_RESULTS.txt qitaf-flutter-source-v0.12.zip qitaf-web-v0.12.zip
          sha256sum qitaf-demo-v0.12-package.zip > qitaf-demo-v0.12-package.sha256
      - name: Upload tested v0.12 files
        uses: actions/upload-artifact@v4
        with:
          name: qitaf-demo-v0.12
          path: qitaf-v12-output/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested v0.12 files on build branch
        run: |
          set -euo pipefail
          mkdir -p qitaf-build
          cp qitaf-v12-output/qitaf-demo-v0.12.apk qitaf-build/
          cp qitaf-v12-output/qitaf-demo-v0.12.sha256 qitaf-build/
          cp qitaf-v12-output/qitaf-demo-v0.12-package.zip qitaf-build/
          cp qitaf-v12-output/qitaf-demo-v0.12-package.sha256 qitaf-build/
          cp qitaf-v12-output/qitaf-flutter-source-v0.12.zip qitaf-build/
          cp qitaf-v12-output/qitaf-web-v0.12.zip qitaf-build/
          cp qitaf-v12-output/BUILD_INFO.txt qitaf-build/BUILD_INFO_V0.12.txt
          cp qitaf-v12-output/CHANGELOG_V0.12_AR.txt qitaf-build/
          cp qitaf-v12-output/USAGE_V0.12_AR.txt qitaf-build/
          cp qitaf-v12-output/APK_SIGNATURE.txt qitaf-build/APK_SIGNATURE_V0.12.txt
          cp qitaf-v12-output/UPGRADE_COMPATIBILITY.txt qitaf-build/UPGRADE_COMPATIBILITY_V0.12.txt
          cp qitaf-v12-output/SOURCE_CLEANUP.txt qitaf-build/SOURCE_CLEANUP_V0.12.txt
          cp qitaf-v12-output/DART_FIX.txt qitaf-build/DART_FIX_V0.12.txt
          cp qitaf-v12-output/ANALYZE.txt qitaf-build/ANALYZE_V0.12.txt
          cp qitaf-v12-output/TEST_RESULTS.txt qitaf-build/TEST_RESULTS_V0.12.txt
          git config user.name 'Qitaf Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qitaf-build/qitaf-demo-v0.12.apk qitaf-build/qitaf-demo-v0.12.sha256 qitaf-build/qitaf-demo-v0.12-package.zip qitaf-build/qitaf-demo-v0.12-package.sha256 qitaf-build/qitaf-flutter-source-v0.12.zip qitaf-build/qitaf-web-v0.12.zip qitaf-build/BUILD_INFO_V0.12.txt qitaf-build/CHANGELOG_V0.12_AR.txt qitaf-build/USAGE_V0.12_AR.txt qitaf-build/APK_SIGNATURE_V0.12.txt qitaf-build/UPGRADE_COMPATIBILITY_V0.12.txt qitaf-build/SOURCE_CLEANUP_V0.12.txt qitaf-build/DART_FIX_V0.12.txt qitaf-build/ANALYZE_V0.12.txt qitaf-build/TEST_RESULTS_V0.12.txt
          if git diff --cached --quiet; then
            echo 'No v0.12 publish changes.'
          else
            git commit -m '[skip ci] Publish tested Qitaf demo v0.12'
            git push origin HEAD:qitaf-apk-build
          fi
